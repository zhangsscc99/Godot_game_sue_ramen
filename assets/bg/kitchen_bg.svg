<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">

  <!-- ═══ 墙壁底色 ═══ -->
  <rect width="800" height="600" fill="#FFF0F8"/>

  <!-- ═══ 墙砖格子 ═══ -->
  <defs>
    <pattern id="tiles" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#FFF0F8"/>
      <rect width="78" height="78" x="1" y="1" fill="#FFF8FC" rx="4"/>
      <!-- 小爱心 -->
      <text x="40" y="48" font-size="14" text-anchor="middle" fill="#FFD0E8" opacity="0.5">♥</text>
    </pattern>
  </defs>
  <rect x="0" y="0" width="800" height="310" fill="url(#tiles)"/>

  <!-- ═══ 墙裙腰线装饰 ═══ -->
  <rect x="0" y="295" width="800" height="18" fill="#FFB3D9"/>
  <rect x="0" y="300" width="800" height="8" fill="#FF85C0"/>
  <!-- 腰线上的小花纹 -->
  <g fill="white" opacity="0.5">
    <circle cx="40"  cy="304" r="3"/>
    <circle cx="120" cy="304" r="3"/>
    <circle cx="200" cy="304" r="3"/>
    <circle cx="280" cy="304" r="3"/>
    <circle cx="360" cy="304" r="3"/>
    <circle cx="440" cy="304" r="3"/>
    <circle cx="520" cy="304" r="3"/>
    <circle cx="600" cy="304" r="3"/>
    <circle cx="680" cy="304" r="3"/>
    <circle cx="760" cy="304" r="3"/>
  </g>

  <!-- ═══ 台面 ═══ -->
  <!-- 台面主体 -->
  <rect x="0" y="308" width="800" height="180" fill="#FFE082"/>
  <!-- 台面顶部高光 -->
  <rect x="0" y="308" width="800" height="14" fill="#FFD54F"/>
  <!-- 台面前缘阴影 -->
  <rect x="0" y="484" width="800" height="8" fill="#F9A825" opacity="0.6"/>

  <!-- 地面 -->
  <rect x="0" y="488" width="800" height="112" fill="#FFECB3"/>
  <!-- 地板砖 -->
  <line x1="0" y1="488" x2="800" y2="488" stroke="#FFD54F" stroke-width="2"/>
  <line x1="0" y1="540" x2="800" y2="540" stroke="#FFD54F" stroke-width="1" opacity="0.5"/>
  <line x1="100" y1="488" x2="100" y2="600" stroke="#FFD54F" stroke-width="1" opacity="0.4"/>
  <line x1="200" y1="488" x2="200" y2="600" stroke="#FFD54F" stroke-width="1" opacity="0.4"/>
  <line x1="300" y1="488" x2="300" y2="600" stroke="#FFD54F" stroke-width="1" opacity="0.4"/>
  <line x1="400" y1="488" x2="400" y2="600" stroke="#FFD54F" stroke-width="1" opacity="0.4"/>
  <line x1="500" y1="488" x2="500" y2="600" stroke="#FFD54F" stroke-width="1" opacity="0.4"/>
  <line x1="600" y1="488" x2="600" y2="600" stroke="#FFD54F" stroke-width="1" opacity="0.4"/>
  <line x1="700" y1="488" x2="700" y2="600" stroke="#FFD54F" stroke-width="1" opacity="0.4"/>

  <!-- ═══ 上方货架 ═══ -->
  <rect x="30" y="145" width="740" height="20" fill="#FFAB40" rx="4"/>
  <rect x="30" y="163" width="740" height="5" fill="#E65100" opacity="0.3"/>
  <!-- 货架支撑 -->
  <rect x="60"  y="165" width="10" height="35" fill="#FFAB40" rx="2"/>
  <rect x="380" y="165" width="10" height="35" fill="#FFAB40" rx="2"/>
  <rect x="730" y="165" width="10" height="35" fill="#FFAB40" rx="2"/>

  <!-- ═══ 货架上的小锅装饰 ═══ -->
  <!-- 小装饰锅1 -->
  <ellipse cx="110" cy="138" rx="20" ry="8"  fill="#FF8F00"/>
  <rect x="92"  cy="125" width="36" height="16" y="125" fill="#FFA000" rx="5"/>
  <rect x="103" cy="120" width="14" height="7"  y="120" fill="#FF8F00" rx="3"/>
  <ellipse cx="110" cy="125" rx="14" ry="5" fill="#FFB300" opacity="0.6"/>

  <!-- 小装饰锅2 (粉色) -->
  <ellipse cx="200" cy="138" rx="20" ry="8"  fill="#F06292"/>
  <rect x="182" cy="125" width="36" height="16" y="125" fill="#EC407A" rx="5"/>
  <rect x="193" cy="120" width="14" height="7"  y="120" fill="#F06292" rx="3"/>

  <!-- 小杯子 -->
  <rect x="250" y="126" width="20" height="22" fill="#80DEEA" rx="3"/>
  <rect x="248" y="124" width="24" height="5"  fill="#4DD0E1" rx="2"/>
  <path d="M270,132 Q280,136 270,140" stroke="#4DD0E1" stroke-width="3" fill="none"/>

  <!-- 小植物 -->
  <rect x="320" y="135" width="12" height="12" fill="#A1887F" rx="2"/>
  <ellipse cx="326" cy="128" rx="8" ry="10" fill="#66BB6A"/>
  <ellipse cx="320" cy="124" rx="6" ry="8"  fill="#81C784"/>
  <ellipse cx="332" cy="125" rx="6" ry="8"  fill="#81C784"/>

  <!-- ═══ 店名招牌 ═══ -->
  <rect x="270" y="30" width="260" height="76" fill="#FF4081" rx="18"/>
  <rect x="275" y="35" width="250" height="66" fill="#FF80AB" rx="14"/>
  <!-- 招牌内花纹 -->
  <circle cx="284" cy="44" r="4" fill="#FF4081" opacity="0.4"/>
  <circle cx="516" cy="44" r="4" fill="#FF4081" opacity="0.4"/>
  <circle cx="284" cy="92" r="4" fill="#FF4081" opacity="0.4"/>
  <circle cx="516" cy="92" r="4" fill="#FF4081" opacity="0.4"/>
  <!-- 招牌文字 -->
  <text x="400" y="63" font-family="'Microsoft YaHei', Arial" font-size="20" font-weight="bold"
        fill="white" text-anchor="middle" filter="url(#shadow)">阿Sue的泡面店</text>
  <text x="400" y="88" font-family="Arial" font-size="13" fill="#FFE0EC" text-anchor="middle">Sue's Noodle House</text>
  <!-- 招牌装饰花 -->
  <text x="282" y="72" font-size="18">🌷</text>
  <text x="502" y="72" font-size="18">🌷</text>

  <!-- ═══ 炉灶区域（4个位置的底座）═══ -->
  <!-- 炉灶台 -->
  <rect x="155" y="308" width="530" height="22" fill="#FF8F00" rx="0"/>
  <rect x="155" y="308" width="530" height="8"  fill="#FFA000"/>

  <!-- 炉眼1 -->
  <ellipse cx="212" cy="319" rx="38" ry="10" fill="#E65100"/>
  <ellipse cx="212" cy="319" rx="30" ry="8"  fill="#BF360C"/>
  <ellipse cx="212" cy="319" rx="20" ry="5"  fill="#8D1F00"/>

  <!-- 炉眼2 -->
  <ellipse cx="345" cy="319" rx="38" ry="10" fill="#E65100"/>
  <ellipse cx="345" cy="319" rx="30" ry="8"  fill="#BF360C"/>
  <ellipse cx="345" cy="319" rx="20" ry="5"  fill="#8D1F00"/>

  <!-- 炉眼3 -->
  <ellipse cx="478" cy="319" rx="38" ry="10" fill="#E65100"/>
  <ellipse cx="478" cy="319" rx="30" ry="8"  fill="#BF360C"/>
  <ellipse cx="478" cy="319" rx="20" ry="5"  fill="#8D1F00"/>

  <!-- 炉眼4 -->
  <ellipse cx="611" cy="319" rx="38" ry="10" fill="#E65100"/>
  <ellipse cx="611" cy="319" rx="30" ry="8"  fill="#BF360C"/>
  <ellipse cx="611" cy="319" rx="20" ry="5"  fill="#8D1F00"/>

  <!-- ═══ 台面装饰品 ═══ -->
  <!-- 右侧碗筷 -->
  <rect x="695" y="340" width="30" height="36" fill="#FFF9C4" rx="4"/>
  <rect x="693" y="338" width="34" height="6"  fill="#FFF176" rx="2"/>
  <rect x="700" y="344" width="3" height="28" fill="#FF7043" rx="1"/>
  <rect x="706" y="344" width="3" height="28" fill="#FF7043" rx="1"/>
  <rect x="712" y="344" width="3" height="28" fill="#FF7043" rx="1"/>
  <rect x="718" y="344" width="3" height="28" fill="#FF7043" rx="1"/>

  <!-- 左侧调料架 -->
  <rect x="60" y="330" width="70" height="50" fill="#FFF9C4" rx="6"/>
  <rect x="60" y="328" width="70" height="8"  fill="#FFF176" rx="3"/>
  <!-- 调料瓶 -->
  <rect x="68"  y="334" width="14" height="36" fill="#EF9A9A" rx="4"/>
  <rect x="68"  y="332" width="14" height="5"  fill="#E57373" rx="2"/>
  <rect x="86"  y="336" width="14" height="34" fill="#A5D6A7" rx="4"/>
  <rect x="86"  y="334" width="14" height="5"  fill="#81C784" rx="2"/>
  <rect x="104" y="334" width="14" height="36" fill="#90CAF9" rx="4"/>
  <rect x="104" y="332" width="14" height="5"  fill="#64B5F6" rx="2"/>

  <!-- 挂钩上的厨具 -->
  <line x1="680" y1="200" x2="680" y2="295" stroke="#FFAB40" stroke-width="3"/>
  <!-- 锅铲 -->
  <rect x="672" y="220" width="6" height="40" fill="#BDBDBD" rx="2"/>
  <ellipse cx="675" cy="218" rx="8" ry="6" fill="#9E9E9E"/>
  <!-- 勺子 -->
  <rect x="684" y="222" width="5" height="38" fill="#BDBDBD" rx="2"/>
  <ellipse cx="686" cy="220" rx="6" ry="8" fill="#9E9E9E"/>

</svg>
